<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.CLIENT_API_URL = "{{ CLIENT_API_URL }}";
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf9f4" />
    <meta
      name="description"
      content="Ivora Charge — pay and start charging in seconds. No app, no account."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Ivora Charge</title>
    <style>
      html, body { min-height: 100%; margin: 0; }
      body { background-color: #fbf9f4; }
      .ivora-boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px; background: #fbf9f4;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      .ivora-boot img {
        width: 72px; height: 72px;
        animation: ivora-pulse 1.6s ease-in-out infinite;
      }
      .ivora-boot .wm {
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        font-weight: 600; font-size: 22px; letter-spacing: -.01em; color: #211d16;
      }
      .ivora-boot .wm span { color: #6f685c; font-weight: 400; }
      @keyframes ivora-pulse { 0%,100% { opacity: .55; transform: scale(.98);} 50% { opacity: 1; transform: scale(1);} }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="ivora-boot">
        <img src="%PUBLIC_URL%/ivora-mark.png" alt="Ivora Charge" />
        <div class="wm">Ivora<span>&nbsp;Charge</span></div>
      </div>
    </div>
  </body>
</html>
